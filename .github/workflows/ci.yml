name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Validate compiled production preflight without external services
        env:
          NODE_ENV: production
          APP_ORIGIN: https://marketpulse.example
          # Public dummy values only; this checker never opens a connection.
          CSRF_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DATABASE_URL: postgresql://example.invalid/marketpulse
          DIRECT_DATABASE_URL: postgresql://example.invalid/marketpulse
          EMAIL_MODE: disabled
          CRYPTO_DATA_MODE: demo
          MARKET_WORKER_ENABLED: 'false'
        run: npm run production:check
      - name: Verify development PostgreSQL
        run: |
          docker compose config --quiet
          docker compose up -d --wait
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1"'
      - name: Apply application migrations and seed twice
        env:
          DATABASE_URL: postgresql://marketpulse:marketpulse_dev@127.0.0.1:5432/marketpulse
          DIRECT_DATABASE_URL: postgresql://marketpulse:marketpulse_dev@127.0.0.1:5432/marketpulse
        run: |
          npm run db:deploy
          npm run db:seed
          npm run db:seed
      - name: Prepare isolated test database
        run: docker compose exec -T postgres createdb -U marketpulse marketpulse_test
      - name: Migrate and test database constraints
        env:
          DATABASE_URL: postgresql://marketpulse:marketpulse_dev@127.0.0.1:5432/marketpulse_test
          DIRECT_DATABASE_URL: postgresql://marketpulse:marketpulse_dev@127.0.0.1:5432/marketpulse_test
          TEST_DATABASE_URL: postgresql://marketpulse:marketpulse_dev@127.0.0.1:5432/marketpulse_test
        run: |
          npm run db:deploy
          npm run test:db
          npm run test:auth:db
          npm run test:markets:db
          npm run test:watchlists:db
          npm run test:alerts:db
          npm run test:notifications:db
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down
